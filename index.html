<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WC 2026 - Live Tables & Matches</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0E1A14;
    color: #F4F1EA;
    min-height: 100vh;
    padding-bottom: 32px;
  }
  header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid #1E2F26;
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 760px;
    margin: 0 auto;
  }
  .crest {
    font-family: 'Archivo Black', sans-serif;
    font-size: 22px;
    background: #00A859;
    color: #0E1A14;
    border-radius: 10px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #7FBFA0;
    font-weight: 600;
    margin-bottom: 2px;
  }
  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 24px;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .status {
    font-size: 11px;
    color: #5A6B62;
    margin-top: 2px;
    min-height: 14px;
  }
  .status.error { color: #E07856; }

  .top-tabs {
    display: flex;
    gap: 8px;
    padding: 14px 20px 0;
    max-width: 760px;
    margin: 0 auto;
  }
  .top-tab {
    flex: 1;
    text-align: center;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #2A3D33;
    background: #152620;
    color: #F4F1EA;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .top-tab:active { transform: scale(0.98); }
  .top-tab.active {
    background: #00A859;
    color: #0E1A14;
    border-color: #00A859;
  }

  .group-nav {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 14px 20px;
    max-width: 760px;
    margin: 0 auto;
    -webkit-overflow-scrolling: touch;
  }
  .grp-btn {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid #2A3D33;
    background: #152620;
    color: #F4F1EA;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .grp-btn:active { transform: scale(0.95); }
  .grp-btn.active {
    background: #00A859;
    color: #0E1A14;
    border-color: #00A859;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 4px 20px;
  }
  .section-title {
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7FBFA0;
    font-weight: 700;
    margin: 20px 0 10px;
  }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid #1E2F26;
    border-radius: 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    padding: 10px 6px;
    text-align: center;
    color: #9AA0A6;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid #1E2F26;
  }
  th.left, td.left { text-align: left; }
  th:first-child, td:first-child { padding-left: 12px; }
  td {
    padding: 10px 6px;
    text-align: center;
    border-bottom: 1px solid #16241D;
  }
  .pts-col { color: #00A859; }
  tr.qualified { background: rgba(0,168,89,0.07); }
  tr { animation: slideIn 0.25s ease-out; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .legend {
    font-size: 12px;
    color: #7FBFA0;
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(0,168,89,0.4);
    display: inline-block;
  }
  .match-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .match-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    background: #152620;
    border: 1px solid #1E2F26;
    border-radius: 10px;
    padding: 10px 14px;
  }
  .match-meta {
    grid-column: 1 / -1;
    font-size: 11px;
    color: #5A6B62;
    margin-bottom: 2px;
    display: flex;
    justify-content: space-between;
  }
  .match-team {
    font-size: 13px;
    font-weight: 600;
  }
  .match-team.right { text-align: right; }
  .score-box {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 800;
    font-size: 16px;
    justify-content: center;
    min-width: 56px;
  }
  .score-box.pending {
    font-size: 12px;
    font-weight: 600;
    color: #5A6B62;
  }
  .score-colon {
    color: #7FBFA0;
  }
  .status-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .status-badge.live {
    background: #E07856;
    color: #0E1A14;
  }
  .status-badge.finished {
    background: #2A3D33;
    color: #9AA0A6;
  }
  .status-badge.upcoming {
    background: transparent;
    color: #5A6B62;
  }
  .next-match-row {
    position: relative;
    overflow: hidden;
  }
  .next-match-row::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #00A859;
  }
  .next-match-countdown {
    font-size: 10px;
    font-weight: 700;
    color: #00A859;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .ko-round-group {
    margin-bottom: 18px;
  }
  .ko-round-title {
    font-size: 12px;
    font-weight: 700;
    color: #F4F1EA;
    margin: 14px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid #1E2F26;
  }
  .empty-state {
    text-align: center;
    color: #5A6B62;
    font-size: 13px;
    padding: 32px 16px;
    border: 1px dashed #2A3D33;
    border-radius: 12px;
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: #5A6B62;
    margin-top: 24px;
    padding: 0 20px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="crest">26</div>
    <div>
      <div class="kicker">WM 2026 · USA · KANADA · MEXIKO</div>
      <h1>Live Tables &amp; Matches</h1>
      <div class="status" id="status"></div>
    </div>
  </div>
</header>

<div class="top-tabs">
  <button class="top-tab active" id="tabGroups">Group Stage</button>
  <button class="top-tab" id="tabNext">Matches</button>
  <button class="top-tab" id="tabKO">Knockout Stage</button>
</div>

<div id="groupNav" class="group-nav"></div>

<main id="mainContent"></main>

<footer>Data via football-data.org. Refreshes automatically every few minutes.</footer>

<script>
  // ---- Konfiguration ----
  // Hier die Railway-URL der Daten-API eintragen (ohne abschliessenden Slash)
  const API_BASE = 'https://wm2026-api-production.up.railway.app';

  const REFRESH_MS = 60 * 1000; // App fragt den Cache-Server jede Minute neu ab

  let cache = { standings: null, matches: null, updatedAt: null, error: null };
  let view = 'groups'; // 'groups' | 'next' | 'ko'
  let activeGroup = null; // z.B. "GROUP_A"

  function setStatus(text, kind) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  function formatUpdatedAt(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString('en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  async function loadData() {
    try {
      const res = await fetch(API_BASE + '/api/data');
      if (!res.ok) throw new Error('Server error ' + res.status);
      const data = await res.json();
      cache = data;

      if (data.error && !data.standings) {
        setStatus(data.error, 'error');
      } else if (data.error) {
        setStatus('Last update: ' + formatUpdatedAt(data.updatedAt) + ' (latest refresh failed)', 'error');
      } else {
        setStatus('Last update: ' + formatUpdatedAt(data.updatedAt));
      }
    } catch (e) {
      setStatus('Unable to connect to the server.', 'error');
    }
    renderAll();
  }

  // ---- Hilfsfunktionen ----

  // Wandelt "Group A" (aus standings) in "GROUP_A" (wie in matches.group) um
  function standingsGroupToMatchGroup(label) {
    return 'GROUP_' + label.replace(/^Group\s+/i, '').trim();
  }

  function getGroupStandings() {
    // football-data.org returns standings as an array, one entry per group
    // jedes Element hat { stage, type, group, table }, group z.B. "Group A"
    if (!cache.standings) return [];
    return cache.standings.filter((s) => s.type === 'TOTAL' && s.group);
  }

  // Liefert Liste von { label: "Group A", matchKey: "GROUP_A" }
  function getGroupList() {
    return getGroupStandings()
      .map((s) => ({ label: s.group, matchKey: standingsGroupToMatchGroup(s.group) }))
      .sort((a, b) => a.label.localeCompare(b.label));
  }

  function getGroupStageMatchesForGroup(matchKey) {
    if (!cache.matches) return [];
    return cache.matches.filter((m) => m.stage === 'GROUP_STAGE' && m.group === matchKey);
  }

  function getKnockoutMatches() {
    if (!cache.matches) return [];
    return cache.matches.filter((m) => m.stage !== 'GROUP_STAGE');
  }

  // Returns the next n matches (not yet finished), across all groups
  // and stages, sorted by kickoff time. Live matches
  // (LIVE/IN_PLAY/PAUSED) are shown first, followed by
  // the next TIMED/SCHEDULED matches.
  function getNextMatches(n) {
    if (!cache.matches) return [];

    const live = cache.matches.filter((m) =>
      ['IN_PLAY', 'PAUSED', 'LIVE'].includes(m.status)
    );

    const upcoming = cache.matches
      .filter((m) => ['TIMED', 'SCHEDULED'].includes(m.status) && m.utcDate)
      .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));

    return [...live, ...upcoming].slice(0, n);
  }

  // Returns the last n finished matches, across all groups and
  // stages, sorted by kickoff time descending (most recent first).
  function getLastMatches(n) {
    if (!cache.matches) return [];

    return cache.matches
      .filter((m) => m.status === 'FINISHED' && m.utcDate)
      .sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate))
      .slice(0, n);
  }

  const STAGE_LABELS = {
    LAST_32: 'Round of 32',
    LAST_16: 'Round of 16',
    ROUND_OF_16: 'Round of 16',
    QUARTER_FINALS: 'Quarter-Finals',
    SEMI_FINALS: 'Semi-Finals',
    THIRD_PLACE: 'Third Place Play-off',
    FINAL: 'Final',
  };

  const STAGE_ORDER = [
    'LAST_32', 'LAST_16', 'ROUND_OF_16', 'QUARTER_FINALS', 'SEMI_FINALS', 'THIRD_PLACE', 'FINAL',
  ];

  function groupByStage(matches) {
    const map = {};
    matches.forEach((m) => {
      const stage = m.stage || 'UNBEKANNT';
      if (!map[stage]) map[stage] = [];
      map[stage].push(m);
    });

    const keys = Object.keys(map);
    keys.sort((a, b) => {
      const ai = STAGE_ORDER.indexOf(a);
      const bi = STAGE_ORDER.indexOf(b);
      const aa = ai === -1 ? 999 : ai;
      const bb = bi === -1 ? 999 : bi;
      return aa - bb;
    });

    return keys.map((k) => ({ stage: k, matches: map[k] }));
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleString('en-GB', {
      weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
    });
  }

  function statusBadge(match) {
    const s = match.status;
    if (s === 'IN_PLAY' || s === 'PAUSED' || s === 'LIVE') {
      return '<span class="status-badge live">LIVE</span>';
    }
    if (s === 'FINISHED') {
      return '<span class="status-badge finished">Finished</span>';
    }
    return '<span class="status-badge upcoming">' + formatDate(match.utcDate) + '</span>';
  }

  function scoreDisplay(match) {
    const s = match.status;
    const finishedOrLive = ['IN_PLAY', 'PAUSED', 'LIVE', 'FINISHED'].includes(s);
    if (finishedOrLive) {
      const full = match.score && match.score.fullTime ? match.score.fullTime : { home: null, away: null };
      const h = full.home === null || full.home === undefined ? '-' : full.home;
      const a = full.away === null || full.away === undefined ? '-' : full.away;
      return '<div class="score-box">' + h + '<span class="score-colon">:</span>' + a + '</div>';
    }
    return '<div class="score-box pending">vs</div>';
  }

  function teamName(team) {
    if (!team || !team.name) return 'TBD';
    return team.shortName || team.name || 'TBD';
  }

  // ---- Rendering ----

  function renderGroupNav() {
    const nav = document.getElementById('groupNav');
    const groups = getGroupList(); // [{label, matchKey}]

    if (view !== 'groups' || !groups.length) {
      nav.style.display = 'none';
      return;
    }
    nav.style.display = 'flex';
    nav.innerHTML = '';

    const matchKeys = groups.map((g) => g.matchKey);
    if (!activeGroup || !matchKeys.includes(activeGroup)) {
      activeGroup = groups[0].matchKey;
    }

    groups.forEach((g) => {
      const shortLabel = g.label.replace(/^Group\s+/i, '');
      const btn = document.createElement('button');
      btn.className = 'grp-btn' + (g.matchKey === activeGroup ? ' active' : '');
      btn.textContent = shortLabel;
      btn.addEventListener('click', () => {
        activeGroup = g.matchKey;
        renderAll();
      });
      nav.appendChild(btn);
    });
  }

  function renderGroupsView() {
    const main = document.getElementById('mainContent');
    const groups = getGroupStandings();

    if (!groups.length) {
      main.innerHTML = '<div class="empty-state">No table data available yet.<br/>Once the group stage begins, tables will appear here automatically.</div>';
      return;
    }

    const groupList = getGroupList();
    const current = groupList.find((g) => g.matchKey === activeGroup) || groupList[0];
    const grp = groups.find((g) => g.group === current.label) || groups[0];
    const groupLabel = grp.group.replace(/^Group\s+/i, '');

    let html = '<h2 class="section-title">Group ' + groupLabel + ' Table</h2>';
    html += '<div class="table-wrap"><table><thead><tr>';
    html += '<th class="left">#</th><th class="left">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Goals</th><th>Diff</th><th class="pts-col">Pts</th>';
    html += '</tr></thead><tbody>';

    grp.table.forEach((row, i) => {
      const cls = i < 2 ? ' class="qualified"' : '';
      const diff = row.goalDifference;
      const diffStr = diff > 0 ? '+' + diff : diff;
      html += '<tr' + cls + '>';
      html += '<td class="left" style="color:#9AA0A6; font-weight:700;">' + row.position + '</td>';
      html += '<td class="left" style="font-weight:600;">' + teamName(row.team) + '</td>';
      html += '<td>' + row.playedGames + '</td>';
      html += '<td>' + row.won + '</td>';
      html += '<td>' + row.draw + '</td>';
      html += '<td>' + row.lost + '</td>';
      html += '<td>' + row.goalsFor + ':' + row.goalsAgainst + '</td>';
      html += '<td>' + diffStr + '</td>';
      html += '<td style="font-weight:800; color:#00A859; font-size:16px;">' + row.points + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<p class="legend"><span class="legend-dot"></span> Positions 1-2 advance to the Round of 32</p>';

    const matches = getGroupStageMatchesForGroup(activeGroup);
    html += '<h2 class="section-title">Group ' + groupLabel + ' Matches</h2>';

    if (!matches.length) {
      html += '<div class="empty-state">No match schedule available yet.</div>';
    } else {
      matches.sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
      html += '<div class="match-list">';
      matches.forEach((m) => {
        html += renderMatchRow(m);
      });
      html += '</div>';
    }

    main.innerHTML = html;
  }

  function formatCountdown(iso) {
    const now = new Date();
    const target = new Date(iso);
    const diffMs = target - now;
    if (diffMs <= 0) return null;

    const totalMinutes = Math.floor(diffMs / 60000);
    const days = Math.floor(totalMinutes / (60 * 24));
    const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
    const minutes = totalMinutes % 60;

    if (days > 0) return 'in ' + days + ' day' + (days === 1 ? '' : 's') + ' ' + hours + ' hr';
    if (hours > 0) return 'in ' + hours + ' hr ' + minutes + ' min';
    return 'in ' + minutes + ' min';
  }

  function groupLabelForMatch(m) {
    if (m.stage === 'GROUP_STAGE' && m.group) {
      return m.group.replace('GROUP_', 'Group ');
    }
    return STAGE_LABELS[m.stage] || m.stage;
  }

  function renderMatchRow(m, options) {
    options = options || {};
    let html = '<div class="match-row' + (options.highlight ? ' next-match-row' : '') + '">';
    html += '<div class="match-meta"><span>';
    if (options.showGroup) {
      html += groupLabelForMatch(m) + ' · ';
    }
    html += formatDate(m.utcDate) + '</span>';

    if (options.highlight && ['TIMED', 'SCHEDULED'].includes(m.status)) {
      const countdown = formatCountdown(m.utcDate);
      if (countdown) {
        html += '<span class="next-match-countdown">' + countdown + '</span>';
      } else {
        html += statusBadge(m);
      }
    } else {
      html += statusBadge(m);
    }
    html += '</div>';

    html += '<span class="match-team">' + teamName(m.homeTeam) + '</span>';
    html += scoreDisplay(m);
    html += '<span class="match-team right">' + teamName(m.awayTeam) + '</span>';
    html += '</div>';
    return html;
  }

  function renderNextView() {
    const main = document.getElementById('mainContent');
    const nextMatches = getNextMatches(3);
    const lastMatches = getLastMatches(3);

    let html = '';

    html += '<h2 class="section-title">Next Matches</h2>';
    if (!nextMatches.length) {
      html += '<div class="empty-state">No upcoming matches found.</div>';
    } else {
      html += '<div class="match-list">';
      nextMatches.forEach((m) => {
        html += renderMatchRow(m, { highlight: true, showGroup: true });
      });
      html += '</div>';
    }

    html += '<h2 class="section-title">Last Results</h2>';
    if (!lastMatches.length) {
      html += '<div class="empty-state">No completed matches yet.</div>';
    } else {
      html += '<div class="match-list">';
      lastMatches.forEach((m) => {
        html += renderMatchRow(m, { showGroup: true });
      });
      html += '</div>';
    }

    main.innerHTML = html;
  }

  function renderKOView() {
    const main = document.getElementById('mainContent');
    const matches = getKnockoutMatches();

    if (!matches.length) {
      main.innerHTML = '<div class="empty-state">The knockout stage is not yet determined.<br/>Once the group stage is complete and the bracket is set, all matchups will appear here automatically.</div>';
      return;
    }

    const stages = groupByStage(matches);
    let html = '';
    stages.forEach(({ stage, matches: stageMatches }) => {
      stageMatches.sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
      const label = STAGE_LABELS[stage] || stage;
      html += '<div class="ko-round-group">';
      html += '<div class="ko-round-title">' + label + '</div>';
      html += '<div class="match-list">';
      stageMatches.forEach((m) => {
        html += renderMatchRow(m);
      });
      html += '</div></div>';
    });

    main.innerHTML = html;
  }

  function renderAll() {
    document.getElementById('tabGroups').classList.toggle('active', view === 'groups');
    document.getElementById('tabNext').classList.toggle('active', view === 'next');
    document.getElementById('tabKO').classList.toggle('active', view === 'ko');

    renderGroupNav();

    if (view === 'groups') {
      renderGroupsView();
    } else if (view === 'next') {
      renderNextView();
    } else {
      renderKOView();
    }
  }

  document.getElementById('tabGroups').addEventListener('click', () => {
    view = 'groups';
    renderAll();
  });
  document.getElementById('tabNext').addEventListener('click', () => {
    view = 'next';
    renderAll();
  });
  document.getElementById('tabKO').addEventListener('click', () => {
    view = 'ko';
    renderAll();
  });

  loadData();
  setInterval(loadData, REFRESH_MS);
</script>

</body>
</html>
